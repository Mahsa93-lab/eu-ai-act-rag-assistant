name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
  docker:
    # builds the image on every push, so the Dockerfile cannot silently break
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t eu-ai-act-rag-assistant .
      - run: docker run --rm eu-ai-act-rag-assistant python -c "import src.api, src.rag, src.retrieval; print('imports ok')"
